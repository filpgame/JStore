name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to rebuild and publish
        required: true
        type: string
      dry_run:
        description: Compute catalog payload and print it without POSTing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Validate signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Decode temporary keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          KEYSTORE_PATH="$RUNNER_TEMP/jstore-release-${GITHUB_RUN_ID}.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          VERSION_NAME="${RELEASE_TAG#v}"
          test -n "$VERSION_NAME"
          echo "tagName=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "versionName=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "versionCode=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          shopt -s nocasematch
          if [[ "$RELEASE_TAG" =~ -beta[0-9]*$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Jaecoo APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew
          assembleJaecooRelease
          -PversionName=${{ steps.version.outputs.versionName }}
          -PversionCode=${{ steps.version.outputs.versionCode }}
          --no-daemon
          -Dorg.gradle.java.home=$JAVA_HOME

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          APK_PATH="$(find app/build/outputs/apk/jaecoo/release -name '*.apk' -type f | head -n 1)"
          test -x "$APKSIGNER"
          test -f "$APK_PATH"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Compute catalog metadata
        id: meta
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          APK_PATH="$(find app/build/outputs/apk/jaecoo/release -name '*.apk' -type f | head -n 1)"
          test -x "$APKSIGNER"
          test -f "$APK_PATH"
          # apksigner prints the digest under "V2 Signer: certificate SHA-256 digest: <hex>"
          # when the APK is signed with APK Signature Scheme v2 (which is what JaecooRelease
          # produces). The previous "Signer #1 certificate SHA-256 digest" pattern matched no
          # line, leaving SIGNER_SHA256 empty and failing the `test -n` check below.
          # Note: with -F': ', the line splits into three fields, so the hex is in $3.
          SIGNER_SHA256="$("$APKSIGNER" verify --print-certs "$APK_PATH" \
            | awk -F': ' '/V2 Signer: certificate SHA-256 digest/ { print tolower($3); exit }')"
          test -n "$SIGNER_SHA256"
          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c %s "$APK_PATH")"
          APK_NAME="$(basename "$APK_PATH")"
          echo "signerSha256=${SIGNER_SHA256}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "sizeBytes=${SIZE_BYTES}" >> "$GITHUB_OUTPUT"
          echo "apkName=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate version.json
        env:
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
        run: |
          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            '{versionName: $versionName, versionCode: $versionCode}' \
            > version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JStore-jaecoo-${{ steps.version.outputs.versionName }}.apk
          path: app/build/outputs/apk/jaecoo/release/*.apk
          if-no-files-found: error

      - name: Upload to jconfig release API
        if: ${{ inputs.dry_run != 'true' }}
        env:
          RELEASE_UPLOAD_TOKEN: ${{ secrets.JCONFIG_RELEASE_UPLOAD_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          TAG_NAME:    ${{ steps.version.outputs.tagName }}
        run: |
          test -n "$RELEASE_UPLOAD_TOKEN"
          APK_PATH="$(find app/build/outputs/apk/jaecoo/release -name '*.apk' -type f | head -n 1)"
          test -f "$APK_PATH"
          echo "Uploading JStore v${VERSION_NAME} (code ${VERSION_CODE}) tag=${TAG_NAME} from ${APK_PATH}"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "https://jconfig.app/v1/upload" \
            -H "Authorization: Bearer ${RELEASE_UPLOAD_TOKEN}" \
            -F "apk=@${APK_PATH}" \
            -F "versionName=${VERSION_NAME}" \
            -F "versionCode=${VERSION_CODE}" \
            -F "tagName=${TAG_NAME}" \
            -F "app=jstore"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tagName }}
          name: ${{ steps.version.outputs.versionName }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/jaecoo/release/*.apk
            version.json

      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tagName }}
        run: |
          # `github.event.release.body` is null on tag pushes because no
          # release exists yet at that point in the workflow; fetch the
          # notes that ``softprops/action-gh-release`` just generated.
          BODY="$(gh release view "$TAG_NAME" --json body --jq .body)"
          BODY="${BODY//$'\n'/\\n}"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish to jconfig catalog (dry-run)
        if: ${{ inputs.dry_run == 'true' }}
        env:
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          TAG_NAME:    ${{ steps.version.outputs.tagName }}
          ORIGINAL_PACKAGE_ID: ${{ vars.JSTOREC_CATALOG_ORIGINAL_PACKAGE_ID || 'com.aurora.store' }}
          CUSTOM_PACKAGE_ID:   ${{ vars.JSTOREC_CATALOG_CUSTOM_PACKAGE_ID   || 'com.aurora.store' }}
          TITLE:               ${{ vars.JSTOREC_CATALOG_TITLE               || 'JStore' }}
          SUMMARY:             ${{ vars.JSTOREC_CATALOG_SUMMARY             || 'Aurora Store build for Jaecoo vehicles' }}
          DEVELOPER_NAME:      ${{ vars.JSTOREC_CATALOG_DEVELOPER           || 'JConfig' }}
          ICON_URL:            ${{ vars.JSTOREC_CATALOG_ICON_URL            || 'https://jconfig.app/brand-icon.png' }}
          CHANGELOG:           ${{ steps.notes.outputs.body }}
          SIGNER_SHA256:       ${{ steps.meta.outputs.signerSha256 }}
          SHA256:              ${{ steps.meta.outputs.sha256 }}
          SIZE_BYTES:          ${{ steps.meta.outputs.sizeBytes }}
          APK_NAME:            ${{ steps.meta.outputs.apkName }}
        run: |
          cat <<EOF
          {
            "originalPackageId": "${ORIGINAL_PACKAGE_ID}",
            "customPackageId": "${CUSTOM_PACKAGE_ID}",
            "title": "${TITLE}",
            "summary": "${SUMMARY}",
            "developerName": "${DEVELOPER_NAME}",
            "iconUrl": "${ICON_URL}",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkName": "${APK_NAME}",
            "downloadUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${APK_NAME}",
            "sizeBytes": ${SIZE_BYTES},
            "sha256": "${SHA256}",
            "signerSha256": "${SIGNER_SHA256}",
            "premium": false,
            "deviceModels": ["J7"],
            "changelog": "${CHANGELOG}"
          }
          EOF

      - name: Publish to jconfig catalog
        if: ${{ inputs.dry_run != 'true' }}
        env:
          RELEASE_UPLOAD_TOKEN: ${{ secrets.JCONFIG_RELEASE_UPLOAD_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          TAG_NAME:    ${{ steps.version.outputs.tagName }}
          ORIGINAL_PACKAGE_ID: ${{ vars.JSTOREC_CATALOG_ORIGINAL_PACKAGE_ID || 'com.aurora.store' }}
          CUSTOM_PACKAGE_ID:   ${{ vars.JSTOREC_CATALOG_CUSTOM_PACKAGE_ID   || 'com.aurora.store' }}
          TITLE:               ${{ vars.JSTOREC_CATALOG_TITLE               || 'JStore' }}
          SUMMARY:             ${{ vars.JSTOREC_CATALOG_SUMMARY             || 'Aurora Store build for Jaecoo vehicles' }}
          DEVELOPER_NAME:      ${{ vars.JSTOREC_CATALOG_DEVELOPER           || 'JConfig' }}
          ICON_URL:            ${{ vars.JSTOREC_CATALOG_ICON_URL            || 'https://jconfig.app/brand-icon.png' }}
          CHANGELOG:           ${{ steps.notes.outputs.body }}
          SIGNER_SHA256:       ${{ steps.meta.outputs.signerSha256 }}
          SHA256:              ${{ steps.meta.outputs.sha256 }}
          SIZE_BYTES:          ${{ steps.meta.outputs.sizeBytes }}
          APK_NAME:            ${{ steps.meta.outputs.apkName }}
        run: |
          test -n "$RELEASE_UPLOAD_TOKEN"
          PAYLOAD=$(jq -n \
            --arg originalPackageId "$ORIGINAL_PACKAGE_ID" \
            --arg customPackageId   "$CUSTOM_PACKAGE_ID" \
            --arg title             "$TITLE" \
            --arg summary           "$SUMMARY" \
            --arg developerName     "$DEVELOPER_NAME" \
            --arg iconUrl           "$ICON_URL" \
            --argjson versionCode   "$VERSION_CODE" \
            --arg versionName       "$VERSION_NAME" \
            --arg apkName           "$APK_NAME" \
            --arg downloadUrl       "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${APK_NAME}" \
            --argjson sizeBytes     "$SIZE_BYTES" \
            --arg sha256            "$SHA256" \
            --arg signerSha256      "$SIGNER_SHA256" \
            --arg changelog         "$CHANGELOG" \
            '{ originalPackageId: $originalPackageId,
               customPackageId: $customPackageId,
               title: $title,
               summary: $summary,
               developerName: $developerName,
               iconUrl: $iconUrl,
               versionCode: $versionCode,
               versionName: $versionName,
               apkName: $apkName,
               downloadUrl: $downloadUrl,
               sizeBytes: $sizeBytes,
               sha256: $sha256,
               signerSha256: $signerSha256,
               premium: false,
               deviceModels: ["J7"],
               changelog: $changelog }')
          printf '%s' "$PAYLOAD" | curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "https://jconfig.app/v1/store/catalog/publish-self" \
            -H "Authorization: Bearer ${RELEASE_UPLOAD_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @-

      - name: Remove temporary keystore
        if: always()
        run: |
          if [ -n "${RELEASE_KEYSTORE_PATH:-}" ] && [ -f "$RELEASE_KEYSTORE_PATH" ]; then
            rm -f -- "$RELEASE_KEYSTORE_PATH"
          fi
